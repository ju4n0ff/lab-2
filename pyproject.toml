[project]
name = "aotts-mvp"
version = "0.1.0"
description = "Sistema de investigacion para timing optimo de compra/venta (MVP: datos, features, modelos, incertidumbre, backtesting)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tensorflow-cpu==2.21.0",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "optuna>=4.0",
    "pydantic>=2.8",
    "requests>=2.32",
    "scipy>=1.14",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos que entrenan modelos",
]
